# version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=vet-system-db
      - DB_PORT=5432
      - DB_DATABASE=vetsystem
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    networks:
      - vet-system

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
    working_dir: /var/www/html
    networks:
      - vet-system

  vet-system-db:
    image: bitnami/postgresql
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - POSTGRESQL_DATABASE=vetsystem
    volumes:
      - vet-system-db-data:/bitnami/postgresql
    networks:
      - vet-system

networks:
  vet-system:
    driver: bridge

volumes:
  vet-system-db-data: